<!-- BASE/TEMPLATE FILE: for some consistency in layout and design (still in progress) --------- -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- logo img instead of title -->
  <!-- <title>{% block title %}My Messier Tracker{% endblock %}</title> -->

  <!-- Background animation on my Login/Register pages: https://vincentgarreau.com/particles.js/ -->
  <!-- fonts/styles -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  {% block head %}{% endblock %}
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- landscape background -->
  <div id="skyscape">
    <svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1440 900" width="100%"
      height="100%">

      <!-- static stars -->
      <g fill="white" opacity="0.6">
        <circle cx="120" cy="80" r="1.5" />
        <circle cx="340" cy="60" r="1" />
        <circle cx="580" cy="90" r="1.5" />
        <circle cx="820" cy="70" r="1" />
        <circle cx="1060" cy="85" r="1.5" />
        <circle cx="1300" cy="65" r="1" />
        <circle cx="200" cy="150" r="1.5" />
        <circle cx="480" cy="130" r="1" />
        <circle cx="760" cy="145" r="1.5" />
        <circle cx="1040" cy="125" r="1" />
        <circle cx="1320" cy="140" r="1.5" />
        <circle cx="280" cy="220" r="1" />
        <circle cx="640" cy="200" r="1.5" />
        <circle cx="1000" cy="215" r="1" />
        <circle cx="1360" cy="195" r="1.5" />
        <circle cx="360" cy="290" r="1" />
        <circle cx="720" cy="275" r="1.5" />
        <circle cx="1080" cy="285" r="1" />
        <circle cx="400" cy="380" r="1.5" />
        <circle cx="800" cy="365" r="1" />
        <circle cx="1200" cy="375" r="1.5" />
      </g>

      <!-- twinkling stars -->
      <circle class="star-tw" style="--dur:3s" cx="180" cy="120" r="2" fill="white" />
      <circle class="star-tw" style="--dur:4s" cx="520" cy="95" r="1.5" fill="white" />
      <circle class="star-tw" style="--dur:2.5s" cx="880" cy="110" r="2" fill="white" />
      <circle class="star-tw" style="--dur:3.5s" cx="1240" cy="85" r="1.5" fill="white" />
      <circle class="star-tw" style="--dur:4.5s" cx="320" cy="180" r="2" fill="white" />
      <circle class="star-tw" style="--dur:3.2s" cx="680" cy="165" r="1.5" fill="white" />
      <circle class="star-tw" style="--dur:2.8s" cx="1040" cy="175" r="2" fill="white" />
      <circle class="star-tw" style="--dur:4.2s" cx="1400" cy="160" r="1.5" fill="white" />
      <circle class="star-tw" style="--dur:3.8s" cx="440" cy="250" r="2" fill="white" />
      <circle class="star-tw" style="--dur:2.6s" cx="920" cy="235" r="1.5" fill="white" />
      <circle class="star-tw" style="--dur:4.8s" cx="1280" cy="245" r="2" fill="white" />

      <!-- logo-style 4-pointed sparkle stars -->
      <!-- static sparkles -->
      <path d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.65" transform="translate(65, 42) scale(0.7)" />
      <path d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.6" transform="translate(155, 308) scale(0.75)" />
      <path d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.55" transform="translate(958, 328) scale(0.65)" />
      <path d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.6" transform="translate(605, 242) scale(0.7)" />
      <!-- twinkling sparkles -->
      <path class="star-tw" style="--dur:5.5s"
            d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.75" transform="translate(718, 52) scale(0.9)" />
      <path class="star-tw" style="--dur:4.2s"
            d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.7" transform="translate(1192, 100) scale(0.7)" />
      <path class="star-tw" style="--dur:6s"
            d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.7" transform="translate(1388, 278) scale(0.85)" />
      <!-- focal sparkle (slightly larger) -->
      <path class="star-tw" style="--dur:3.8s"
            d="M0,-9 L1.2,-1.2 L9,0 L1.2,1.2 L0,9 L-1.2,1.2 L-9,0 L-1.2,-1.2 Z"
            fill="white" opacity="0.8" transform="translate(452, 168) scale(1.1)" />

      <!-- simplified back mountain range -->
      <path fill="#1a1625" opacity="0.7"
        d="M0,900 L0,550 L200,480 L400,520 L600,460 L800,500 L1000,440 L1200,480 L1440,420 L1440,900 Z" />

      <!-- simplified front mountain range -->
      <path fill="#0f0c15" opacity="0.8"
        d="M0,900 L0,650 L180,620 L360,580 L540,620 L720,580 L900,620 L1080,580 L1260,620 L1440,590 L1440,900 Z" />

      <!-- simplified treeline silhouette -->
      <path fill="#06040a" opacity="0.9"
        d="M0,900 L0,820 L60,800 L120,820 L180,800 L240,820 L300,800 L360,820 L420,800 L480,820 L540,800 L600,820 L660,800 L720,820 L780,800 L840,820 L900,800 L960,820 L1020,800 L1080,820 L1140,800 L1200,820 L1260,800 L1320,820 L1380,800 L1440,820 L1440,900 Z" />

    </svg>
  </div>

  <!-- header -->
  {% include "partials/header.html" %}

  <!-- placeholder for page content  -->
  <main class="container py-4 flex-fill" style="position:relative; z-index:1; padding-bottom:90px;">
    {% block content %}{% endblock %}
  </main>


  <!-- footer -->
  {% include "partials/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>



</html>
