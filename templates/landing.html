{% extends "base.html" %}

{% block content %}
<div class="text-center mb-4">
    <a href="{{ url_for('login') }}" class="btn btn-primary me-2">Log In</a>
    <a href="{{ url_for('register') }}" class="btn btn-outline-light">Create Account</a>
</div>




<!-- Carousel -->
<div id="demo" class="carousel slide rounded-3 overflow-hidden" data-bs-ride="carousel"
    style="filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.7));">

    <!-- Indicators/dots -->
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-current="true"
            aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>


    <!-- Slides -->
    <div class="carousel-inner">

        <!-- 1: Progress -->
        <div class="carousel-item active">
            <img src="{{ url_for('static', filename='img/c_analytics.png') }}" class="d-block mx-auto"
                style="width:880px; height:480px; object-fit:cover;" alt="Analytics">
            <div class="carousel-caption w-100 text-center top-0 start-50 translate-middle-x"
                style="bottom:auto; padding:.5rem 1rem;">
                <h5 class="m-0"
                    style="font-size:2.25rem; font-weight:800; text-shadow:0.5px 0.5px 4px rgba(0, 0, 0, 0.99);">
                    Track Your Progress
                </h5>
            </div>
        </div>

        <!-- 2: Your Catalogue -->
        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/c_journal.png') }}" class="d-block mx-auto"
                style="width:880px; height:480px; object-fit:cover;" alt="Your Catalogue">
            <div class="carousel-caption w-100 text-center top-0 start-50 translate-middle-x"
                style="bottom:auto; padding:.5rem 1rem;">
                <h5 class="m-0" 
                    style="font-size:2.25rem; font-weight:800; text-shadow:0.5px 0.5px 4px rgba(0, 0, 0, 0.99);">
                    Your Catalogue with Your Images and Log Notes
                </h5>
            </div>
        </div>

        <!-- 3: Discover More -->
        <div class="carousel-item">
            <img src="{{ url_for('static', filename='img/c_details.png') }}" class="d-block mx-auto"
                style="width:880px; height:480px; object-fit:cover;" alt="Discover More">
            <div class="carousel-caption w-100 text-center top-0 start-50 translate-middle-x"
                style="bottom:auto; padding:.5rem 1rem;">
                <h5 class="m-0" 
                    style="font-size:2.25rem; font-weight:800; text-shadow:0.5px 0.5px 4px rgba(0, 0, 0, 0.99);">
                    Learn More About The Messier Objects
                </h5>
            </div>
        </div>

    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

{% endblock %}
