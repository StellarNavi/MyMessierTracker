<!-- bridge-like page between dashboard and login that lets user know the deletion was successful -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account Deleted</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <!-- Modal -->
  <div class="modal fade" id="deletedModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-light border border-2 border-danger justify-content-center text-center">
        <!-- remove standard line breaks with border-0 (cluttered/distracting) -->
        <div class="modal-header border-0 justify-content-center">
          <h5 class="modal-title fw-bold  m-0">... Who are you? </h5>
        </div>
        <div class="modal-body text-center">
          Account successfully deleted.
        </div>
        <div class="modal-footer border-0">
          <button id="goLogin" type="button" class="btn btn-danger">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const m = new bootstrap.Modal(document.getElementById('deletedModal'));
    m.show();
    // send user back to login page (this allows them to attempt to login and see their acct no longer exists
    // and also allows them to click register to create a  new account if desired) 
    document.getElementById('goLogin').addEventListener('click', () => {
      m.hide();
      window.location = "{{ url_for('register') }}";
    });
  </script>
</body>
</html>
